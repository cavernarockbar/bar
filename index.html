<script>
    const imagens = [
        'img/cardapio1.jpg',
        'img/cardapio2.jpg',
        'img/cardapio3.jpg',
        'img/cardapio4.jpg',
        'img/cardapio5.jpg'
    ];

    let indice = 0;
    const slide = document.getElementById('slide');

    setInterval(() => {
        indice = (indice + 1) % imagens.length;
        slide.src = imagens[indice];
    }, 4000); // troca a cada 4 segundos
</script>
