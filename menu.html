<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Caverna Rock Bar</title>
</head>
<header class="text-center">
    <img src="img/Cavernarockbar.jpg" alt="logo" class="rounded-circle" width="100" height="100"
            srcset="">
</header>
<body>
    <div id="cardapio" class="text-center">
        <img id="slide" src="img/1.png" alt="Cardápio" class="img-fluid rounded shadow" style="max-height: 600px;">
</div>

<script>
    const imagens = [
        'img/1.png',
        'img/2.png',
        'img/3.png',
        'img/4.png',
        'img/5.png',
        'img/6.png'
    ];

    let indice = 0;
    const slide = document.getElementById('slide');

    setInterval(() => {
        indice = (indice + 1) % imagens.length;
        slide.src = imagens[indice];
    }, 10000); // troca a cada 1 segundos
</script>

<div>
    <h1>

    </h1>
                <h4 class="text-center">
                                    cavernarockbar.github.io/bar
                                </h4>
            </div>
        
    </header>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
