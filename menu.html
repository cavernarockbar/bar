<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Caverna Rock Bar</title>
</head>

<body>
    <header class="container text-center">
        <img src="img/Cavernarockbar.jpg" alt="avatar da Fernanda" class="rounded-circle" width="100" height="100"
            srcset="">
                    
        </div>
        <div id="cardapio" class="text-center">
    <h2>Cardápio</h2>
    <img id="slide" src="img/cardapio1.jpg" alt="Cardápio" class="img-fluid rounded shadow" style="max-height: 600px;">
</div>

<script>
    const imagens = [
        'img/cardapio1.jpg',
        'img/cardapio2.jpg',
        'img/cardapio3.jpg',
        'img/cardapio4.jpg',
        'img/cardapio5.jpg'
    ];

    let indice = 0;
    const slide = document.getElementById('slide');

    setInterval(() => {
        indice = (indice + 1) % imagens.length;
        slide.src = imagens[indice];
    }, 4000); // troca a cada 4 segundos
</script>

        
    </header>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
